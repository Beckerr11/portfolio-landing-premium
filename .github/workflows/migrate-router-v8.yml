name: One-time React Router 8 migration

on:
  push:
    branches: [fix/verified-credentials-only]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: fix/verified-credentials-only

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Update package manifest
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          const file = 'package.json'
          const pkg = JSON.parse(fs.readFileSync(file, 'utf8'))
          pkg.engines = { ...(pkg.engines || {}), node: '>=22.22.0' }
          pkg.dependencies.react = '^19.2.8'
          pkg.dependencies['react-dom'] = '^19.2.8'
          delete pkg.dependencies['react-router-dom']
          pkg.dependencies['react-router'] = '^8.3.0'
          fs.writeFileSync(file, `${JSON.stringify(pkg, null, 2)}\n`)
          NODE

      - name: Migrate imports to react-router
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            sed -i 's/react-router-dom/react-router/g' "$file"
          done < <(find src -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print0)

      - name: Refresh lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify deterministic install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit verified migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json src
          git commit -m 'fix: migrate portfolio routing to secure React Router 8'
          git push origin HEAD:fix/verified-credentials-only
